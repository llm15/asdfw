name: Fetch SAS availability data

on:
  schedule:
    # Fires every 6 hours; the random-delay step below then spreads the
    # actual fetch across a further ~3h window so requests aren't sent at a
    # predictable exact time every run.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Least privilege: only contents write is needed to commit the data file.
permissions:
  contents: write

# Avoid two scheduled/manual runs racing to commit at once; queue instead of
# cancelling so an in-progress atomic write is never interrupted.
concurrency:
  group: fetch-sas-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js (current LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Camoufox browser
        run: npx camoufox fetch

      - name: Random delay (avoid predictable request timing)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 10800))

      - name: Fetch latest SAS availability
        run: npm run fetch:data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data/latest.json; then
            echo "No changes to commit."
            exit 0
          fi
          git add docs/data/latest.json
          git commit -m "chore: update SAS availability data"
          git pull --rebase
          git push

      - name: Check preferences and notify (Telegram)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run notify

      - name: Commit and push notified-state if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- docs/data/notified-state.json)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git add docs/data/notified-state.json
          git commit -m "chore: update notification state"
          git pull --rebase
          git push
